<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetris Oyunu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="game-info">
            <h1>Tetris Oyunu</h1>
            <div class="score-container">
                <p>Skor: <span id="score">0</span></p>
                <p>Seviye: <span id="level">1</span></p>
                <p>Satırlar: <span id="lines">0</span></p>
            </div>
            <div class="controls-info">
                <h2>Kontroller</h2>
                <p>← → : Sağa/Sola hareket</p>
                <p>↑ : Döndür</p>
                <p>↓ : Hızlı düşür</p>
                <p>Boşluk : Anında düşür</p>
                <p>P : Duraklat/Devam et</p>
            </div>
            <div class="next-piece">
                <h2>Sonraki Parça</h2>
                <canvas id="nextPiece" width="100" height="100"></canvas>
            </div>
            <button id="start-button">Oyunu Başlat</button>
            <button id="pause-button">Duraklat</button>
        </div>
        <div class="game-board">
            <canvas id="tetris" width="300" height="600"></canvas>
        </div>
    </div>
    <script src="js/tetris.js"></script>
</body>
</html>
